<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="glassArrowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FF5CB8"/>
      <stop offset="100%" stop-color="#D90D87"/>
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5CB8"/>
      <stop offset="100%" stop-color="#D90D87"/>
    </linearGradient>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#D90D87" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#glassShadow)">
    <polygon points="512,252 650,532 512,472 374,532" 
             fill="url(#glassArrowGrad)" 
             stroke="#FFFFFF" 
             stroke-width="4" 
             stroke-linejoin="round"/>
             
    <polygon points="512,252 512,472 374,532" 
             fill="#FFFFFF" 
             opacity="0.28"/>
  </g>

  <circle cx="512" cy="512" r="64" fill="none" stroke="#D90D87" stroke-width="4" opacity="0.60"/>
  <circle cx="512" cy="512" r="88" fill="none" stroke="#D90D87" stroke-width="2" opacity="0.30"/>

  <circle cx="512" cy="512" r="36" fill="url(#beaconGrad)" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="512" cy="512" r="14" fill="#FFFFFF"/>
</svg>